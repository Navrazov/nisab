<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161a22" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      This covers what a <meta http-equiv> CSP can: script/style/font/img
      origins. It cannot set frame-ancestors, HSTS or X-Content-Type-Options —
      those only take effect as real HTTP response headers, which means
      configuring them on the CDN/object storage in front of this static
      build, not in this file.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-82X+UBl2aaBH2NR2wZ2GJ1YSuBxEhuHMcqO1VmWo7Rc='; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=optional"
    />
    <meta
      name="description"
      content="NISAB — калькулятор рассрочки без банка и скрытых процентов. Рассчитайте наценку и ежемесячный платёж на любой товар."
    />
    <title>NISAB — исламская рассрочка</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('nisab-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          if (theme === 'dark') document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
