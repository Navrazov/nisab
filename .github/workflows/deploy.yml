name: Deploy to Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Yandex Object Storage is S3-compatible, so the standard AWS CLI
      # (preinstalled on GitHub-hosted runners) works against it directly —
      # just point it at the Yandex endpoint instead of AWS's.
      # CDN edge cache TTL is set to 5 minutes, so a new deploy goes live on
      # its own shortly after upload — no separate purge step needed.
      - name: Sync dist/ to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net \
            s3 sync dist/ "s3://${{ secrets.YC_BUCKET_NAME }}" --delete
